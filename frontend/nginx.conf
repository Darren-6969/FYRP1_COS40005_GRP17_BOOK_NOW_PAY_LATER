server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed Vite build assets never change, so cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Host-site embed script (public/embed/v1/bnpl-embed.js). Short cache so
    # host sites pick up fixes quickly.
    location /embed/v1/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Replaces the vercel.json header: only the client's site may iframe /embed.
    location = /embed {
        add_header Content-Security-Policy "frame-ancestors 'self' https://questdigitalsolutions.com;" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Replaces the vercel.json rewrite: every app route falls back to index.html
    # so React Router handles it (no 404 on refresh).
    # Note: no "$uri/" here, otherwise /embed would hit the embed/ folder and 403.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
